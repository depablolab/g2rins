name: trunk

on:
  push:
    branches:
      - main
      - trunk-merge/**
  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 0 1 * *"

jobs:
  trunk:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
