name: trunk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 0 1 * *"

permissions:
  checks: write
  contents: read

jobs:
  trunk:
    name: Trunk Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
