name: notebooks

# Manual-dispatch only: a full run executes the guide end-to-end and generates
# every ensemble in the paper SI across the whole OS/Python matrix.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs the full history and tags to derive the version.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: pip install g2rins Python package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install jupytext ipython jupyter
          python -m pip install .

      - name: Create test with Jupytext
        shell: bash -l {0}
        run: jupytext --to py G2RINS_guide.ipynb
      - name: Run Notebook test
        run: python G2RINS_guide.py
