name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs the full history and tags to derive the version.
          fetch-depth: 0

      - name: Verify CITATION.cff matches the release tag
        # The github-release job publishes whatever a v* tag points at;
        # fail the build first when the citation metadata was not bumped.
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          citation_version="$(sed -n 's/^version: *//p' CITATION.cff | tr -d '"')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${citation_version}" != "${tag_version}" ]; then
            echo "CITATION.cff says version ${citation_version}, but the tag is ${GITHUB_REF_NAME}. Bump CITATION.cff (version and date-released) and re-tag." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Pin release builds to the highest CI-tested Python; a floating
          # "3.x" would silently adopt new releases before CI covers them.
          python-version: "3.14"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check built distributions
        run: python -m twine check --strict dist/*

      - name: Store the distribution packages
        # Only the tag-triggered github-release job consumes this artifact.
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  github-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
